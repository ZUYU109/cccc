<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>For Carrie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520&family=Great+Vibes&family=Nunito:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --night: #140e14;
      --cream: #f6ead9;
      --gold: #e0b57a;
      --rose: #e8a4a8;
      --ink: #2a1730;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--night);
      color: var(--cream);
      font-family: Nunito, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        radial-gradient(900px 480px at 50% 120%, #4a2236 0%, transparent 55%),
        radial-gradient(600px 360px at 15% 10%, #2c1630 0%, transparent 50%),
        radial-gradient(520px 320px at 90% 0%, #1e2438 0%, transparent 46%),
        var(--night);
    }

    .wrap {
      width: min(860px, 100%);
      text-align: center;
    }

    .kicker {
      position: relative;
      z-index: 1;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 6px;
    }

    h1 {
      font-family: "Great Vibes", cursive;
      font-weight: 400;
      font-size: clamp(64px, 12vw, 96px);
      line-height: 1.25;
      padding-top: 0.28em;
      margin-bottom: 28px;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    a.choice {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      padding: 28px 18px 24px;
      border-radius: 28px;
      border: 1px solid rgba(246, 234, 217, 0.14);
      background: rgba(255, 247, 241, 0.04);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    a.choice:hover, a.choice:focus-visible {
      transform: translateY(-4px);
      background: rgba(255, 247, 241, 0.08);
      border-color: rgba(224, 181, 122, 0.55);
      outline: none;
    }

    .mark {
      width: 92px;
      height: 92px;
      margin-bottom: 14px;
    }

    .mark svg { width: 100%; height: 100%; overflow: visible; }

    h2 {
      font-family: Fraunces, serif;
      font-weight: 520;
      font-size: 28px;
      margin-bottom: 6px;
    }

    p.blurb {
      max-width: 240px;
      color: rgba(246, 234, 217, 0.72);
      font-size: 14px;
      line-height: 1.45;
    }

    .go {
      margin-top: 16px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }

    @media (max-width: 700px) {
      body {
        place-items: start center;
        padding: max(20px, env(safe-area-inset-top)) 14px 28px;
      }
      .kicker { font-size: 15px; letter-spacing: 0.18em; }
      h1 { font-size: 58px; margin-bottom: 16px; }
      .choices { grid-template-columns: 1fr; }
      a.choice { min-height: 0; padding: 20px 16px 18px; }
      .mark { width: 72px; height: 72px; margin-bottom: 8px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="kicker">For Carrie</p>
    <h1>Pick one</h1>
    <div class="choices">
      <a class="choice" href="note.html">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 92 92">
            <ellipse cx="46" cy="84" rx="22" ry="4" fill="#000" opacity="0.25" />
            <circle cx="46" cy="48" r="26" fill="#f3d2c2" />
            <path d="M24 40c6-22 16-30 22-30 6 0 8 4 12 4s6-4 11-4c10 0 18 10 22 28-10-6-22-10-34-10S34 34 24 40z" fill="#2b1a22" />
            <ellipse cx="30" cy="34" rx="8" ry="10" fill="#2b1a22" />
            <ellipse cx="62" cy="34" rx="8" ry="10" fill="#2b1a22" />
            <ellipse cx="34" cy="56" rx="6" ry="3.5" fill="#e58b90" />
            <ellipse cx="58" cy="56" rx="6" ry="3.5" fill="#e58b90" />
            <path d="M36 50c3 4 7 4 10 0" stroke="#2b1a22" stroke-width="2" fill="none" stroke-linecap="round" />
            <path d="M48 50c3 4 7 4 10 0" stroke="#2b1a22" stroke-width="2" fill="none" stroke-linecap="round" />
            <path d="M42 60c3 3 7 3 10 0" stroke="#b56b72" stroke-width="1.6" fill="none" stroke-linecap="round" />
            <circle cx="74" cy="28" r="6" fill="#d45d6a" />
            <circle cx="82" cy="36" r="5" fill="#e8a4a8" />
            <circle cx="68" cy="36" r="5" fill="#c94b5c" />
          </svg>
        </div>
        <h2>I'm sorry</h2>
        <p class="blurb">She's in the middle. Find the gold petal with the next word.</p>
        <span class="go">Find it</span>
      </a>
      <a class="choice" href="hearts.html">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 92 92">
            <path d="M46 78C18 58 10 40 10 28 10 16 20 8 32 8c8 0 12 4 14 8 2-4 6-8 14-8 12 0 22 8 22 20 0 12-8 30-36 50z" fill="#ff6d8d" />
            <path d="M46 70C26 54 20 40 20 30c0-8 6-14 14-14 6 0 9 3 12 7 3-4 6-7 12-7 8 0 14 6 14 14 0 10-6 24-26 40z" fill="#ff8fa8" opacity="0.45" />
          </svg>
        </div>
        <h2>I love you</h2>
        <p class="blurb">Hearts drift around. Tap the one carrying the next letter.</p>
        <span class="go">Chase</span>
      </a>
      <a class="choice" href="miss.html">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 92 92">
            <circle cx="40" cy="46" r="22" fill="#f3e2b0" />
            <circle cx="50" cy="40" r="18" fill="#1a1224" />
            <circle cx="68" cy="28" r="2" fill="#fff6ea" />
            <circle cx="74" cy="40" r="1.4" fill="#fff6ea" />
            <circle cx="62" cy="22" r="1.2" fill="#fff6ea" />
          </svg>
        </div>
        <h2>Miss you</h2>
        <p class="blurb">Flip two cards. Match the pictures.</p>
        <span class="go">Flip</span>
      </a>
    </div>
  </main>
</body>
</html>
