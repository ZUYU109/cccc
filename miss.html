<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Miss you, Carrie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f6ead9;
      --gold: #e7c48a;
      --ink: #2a1730;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #140e18;
      color: var(--cream);
      font-family: Nunito, sans-serif;
    }

    .sky {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(18px, env(safe-area-inset-top)) 16px 24px;
      background:
        radial-gradient(800px 480px at 50% 110%, #4a2840 0%, transparent 55%),
        radial-gradient(500px 320px at 80% 0%, #24304a 0%, transparent 50%),
        #160f18;
    }

    .home, .mute, .again {
      border: 1px solid rgba(231, 196, 138, 0.5);
      color: var(--gold);
      background: transparent;
      border-radius: 999px;
      font: 700 12px Nunito, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .home, .mute {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      padding: 7px 12px;
    }

    .home { left: 16px; }
    .mute { right: 16px; appearance: none; cursor: pointer; }

    .line {
      margin-top: 52px;
      min-height: 64px;
      text-align: center;
      font-family: "Great Vibes", cursive;
      font-size: clamp(40px, 10vw, 68px);
      line-height: 1.1;
    }

    .hint {
      min-height: 22px;
      margin-bottom: 18px;
      text-align: center;
      color: rgba(246, 234, 217, 0.78);
      font-size: 15px;
    }

    .board {
      width: min(360px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      aspect-ratio: 3 / 4;
      border: 0;
      border-radius: 18px;
      background: rgba(255, 247, 241, 0.06);
      box-shadow: inset 0 0 0 1px rgba(246, 234, 217, 0.16);
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .card svg { width: 58%; height: 58%; opacity: 0; transform: scale(0.8); }
    .card.up svg, .card.held svg { opacity: 1; transform: none; }
    .card.held { background: rgba(231, 196, 138, 0.14); }

    .again {
      margin-top: 22px;
      padding: 10px 18px;
      cursor: pointer;
    }

    .hidden { display: none; }

    @media (max-width: 700px) {
      .board { gap: 10px; }
      .home, .mute { padding: 6px 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="sky">
    <a class="home" href="./">Back</a>
    <button class="mute" id="mute" type="button">Sound</button>
    <p class="line" id="line">Miss you</p>
    <p class="hint" id="hint">Flip two.</p>
    <div class="board" id="board"></div>
    <button class="again hidden" id="again" type="button">Again</button>
  </div>
  <script>
    const KINDS = ["moon", "heart", "flower"];
    const FACES = {
      moon: '<svg viewBox="0 0 64 64"><circle cx="28" cy="32" r="16" fill="#f3e2b0"/><circle cx="36" cy="26" r="13" fill="#1a1224"/></svg>',
      heart: '<svg viewBox="0 0 64 64"><path fill="#ff6d8d" d="M32 52C14 40 8 30 8 21 8 14 13 8 21 8c5 0 8 3 11 8 3-5 6-8 11-8 8 0 13 6 13 13 0 9-6 19-24 31z"/></svg>',
      flower: '<svg viewBox="0 0 64 64"><circle cx="32" cy="18" r="7" fill="#e8a4a8"/><circle cx="20" cy="28" r="7" fill="#d45d6a"/><circle cx="44" cy="28" r="7" fill="#e8b4b0"/><circle cx="26" cy="40" r="7" fill="#c94b5c"/><circle cx="38" cy="40" r="7" fill="#f3c7c4"/><circle cx="32" cy="30" r="5" fill="#e7c48a"/></svg>'
    };

    const boardEl = document.getElementById("board");
    const lineEl = document.getElementById("line");
    const hintEl = document.getElementById("hint");
    const againEl = document.getElementById("again");

    let open = [];
    let locked = false;
    let found = 0;
    let soundOn = true;
    let audioCtx = null;

    function tone(freq) {
      if (!soundOn) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && Ctx) audioCtx = new Ctx();
      if (!audioCtx) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.07, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.18);
    }

    function shuffle(list) {
      const copy = list.slice();
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function deal() {
      open = [];
      locked = false;
      found = 0;
      lineEl.textContent = "Miss you";
      hintEl.textContent = "Flip two.";
      againEl.classList.add("hidden");
      boardEl.innerHTML = "";
      shuffle(KINDS.concat(KINDS)).forEach((kind) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";
        card.dataset.kind = kind;
        card.innerHTML = FACES[kind];
        card.addEventListener("click", () => flip(card));
        boardEl.appendChild(card);
      });
    }

    function flip(card) {
      if (locked || card.classList.contains("up") || card.classList.contains("held")) return;
      card.classList.add("up");
      open.push(card);
      tone(440);
      if (open.length < 2) return;
      locked = true;
      const [first, second] = open;
      if (first.dataset.kind === second.dataset.kind) {
        first.classList.add("held");
        second.classList.add("held");
        open = [];
        locked = false;
        found += 1;
        tone(620);
        if (found === 3) {
          lineEl.textContent = "Miss you, Carrie";
          hintEl.textContent = "All three pairs.";
          againEl.classList.remove("hidden");
          tone(740);
        }
        return;
      }
      hintEl.textContent = "Not a pair.";
      window.setTimeout(() => {
        first.classList.remove("up");
        second.classList.remove("up");
        open = [];
        locked = false;
        hintEl.textContent = "Flip two.";
      }, 700);
    }

    document.getElementById("again").addEventListener("click", deal);
    document.getElementById("mute").addEventListener("click", () => {
      soundOn = !soundOn;
      document.getElementById("mute").textContent = soundOn ? "Sound" : "Muted";
    });

    deal();
  </script>
</body>
</html>
